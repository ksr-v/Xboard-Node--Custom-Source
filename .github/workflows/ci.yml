name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish Docker images to GHCR after successful validation
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Test dependency tooling and installer fixtures
        run: |
          python3 tools/test_dependencies.py
          python3 tools/test_kernel_patches.py
          python3 tools/test_release_assets.py
          python3 tools/test_release_metadata.py
          python3 tools/test_installer.py
          python3 tools/test_replacement.py
          python3 tools/test_node_menu.py

      - name: Restore pinned dependency snapshot
        run: python3 tools/ci_snapshot.py

      - name: Run tests
        run: make dependency-verify test

      - name: Test actual UDP traffic in private network and mount namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iptables nftables iproute2
          go test -c -tags netns -o .dependency-work/inputfirewall-netns.test ./internal/inputfirewall
          sudo python3 tools/test_inputfirewall_netns.py --binary "$PWD/.dependency-work/inputfirewall-netns.test"

      - name: Damage a real C-risk module in a disposable copy
        run: python3 tools/corruption_test.py

  recovery:
    name: Protected upstream failure simulation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Enable ARM64 executable smoke tests
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Restore pinned dependency snapshot
        run: python3 tools/ci_snapshot.py
      - name: Empty caches, protected modules local only, both architectures and binaries
        run: python3 tools/dependencies.py recovery-test
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-recovery-evidence
          path: |
            .dependency-work/recovery-*/results.json
            .dependency-work/recovery-*/*.log
          include-hidden-files: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, recovery]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Restore pinned dependency snapshot
        run: python3 tools/ci_snapshot.py

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload xboard-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload xbctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xbctl-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, recovery]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned dependency snapshot
        run: python3 tools/ci_snapshot.py

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image and publish only when requested
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_images) }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xboard-node:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/xboard-node:{1}', github.repository_owner, github.ref_name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-linux-*'
          merge-multiple: true
          path: dist
      - name: Publish new immutable Release or verify an existing publication
        run: |
          cp install.sh dist/install.sh
          (cd dist && sha256sum xboard-node-linux-* xbctl-linux-* install.sh > SHA256SUMS)
          python3 tools/verify_release_assets.py dist --installer install.sh
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            mkdir published
            for asset in xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh SHA256SUMS; do
              gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir published
            done
            python3 tools/verify_release_assets.py published --installer install.sh
            for asset in xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh; do
              cmp "dist/$asset" "published/$asset"
            done
            echo 'Existing Release assets verified; leaving the publication unchanged.'
            exit 0
          fi
          cp "UPGRADE-$GITHUB_REF_NAME.zh-CN.md" dist/
          cp "VERIFICATION-$GITHUB_REF_NAME.json" dist/VERIFICATION.json
          cd dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "../RELEASE-$GITHUB_REF_NAME.md" \
            xboard-node-linux-amd64 xboard-node-linux-arm64 xbctl-linux-amd64 xbctl-linux-arm64 install.sh SHA256SUMS \
            "UPGRADE-$GITHUB_REF_NAME.zh-CN.md" VERIFICATION.json
